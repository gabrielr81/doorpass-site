server_tokens off;
gzip on;
gzip_types text/css application/javascript image/svg+xml application/xml text/plain;


server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;
  ssi on;

  # The logo QR code opens /GO (uppercase, because the QR uses its compact alphanumeric mode): send any case of /go to the home page.
  location ~* ^/go/?$ { return 302 /; }

  # Hosted billing (#245): Stripe customer portal login (TEST mode until go-live; swap for the live login URL then).
  location ~* ^/billing/?$ { return 302 https://billing.stripe.com/p/login/test_14A5kD9Zsf5x1rxgP0fMA00; }

  # nginx drops server-level headers in a location that sets its own, so each one repeats the include.
  # Header and footer fragments. SSI include virtual can read them; a direct request cannot.
  location /partials/ { internal; include /etc/nginx/security-headers.conf; }
  location /assets/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
